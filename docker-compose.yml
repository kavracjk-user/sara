# SARA — aplicación. PostgreSQL (fase 0) y API (fase 4). Wazuh vive aparte, en
# lab/wazuh/docker-compose.yml (solo se lee). La interfaz (fase 5) se agregará aquí.
# Uso:  cp .env.example .env   # y edita las claves
#       docker compose up -d postgres
#       docker compose --profile api up -d --build api   # requiere API_KEY_SARA propia en .env
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
    ports:
      - "127.0.0.1:5432:5432"   # solo accesible desde esta máquina
    volumes:
      - sara_pgdata:/var/lib/postgresql/data
      # Se ejecuta solo la PRIMERA vez que se crea el volumen.
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    profiles: ["api"]        # no arranca con un `up` normal; usar --profile api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Solo las variables que la API usa (no env_file: pasaría también las claves de
    # administración de Wazuh, que la API no necesita).
    environment:
      # Sin clave, la API responde 503 a todo (no atiende sin autenticación).
      API_KEY_SARA: ${API_KEY_SARA:-}
      SARA_CORS_ORIGEN: ${SARA_CORS_ORIGEN:-http://localhost:5173}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Wazuh publica el indexador en 127.0.0.1:9200 del equipo; desde el contenedor
      # se llega por host.docker.internal y el certificado se valida contra su nombre.
      WAZUH_INDEXER_URL: https://host.docker.internal:9200
      WAZUH_INDEXER_USER: ${WAZUH_INDEXER_USER}
      WAZUH_INDEXER_PASS: ${WAZUH_INDEXER_PASS}
      WAZUH_INDEXER_TLS_NOMBRE: ${WAZUH_INDEXER_TLS_NOMBRE:-wazuh.indexer}
      WAZUH_CA_CERT: /certs/root-ca.pem
    volumes:
      - ./lab/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/certs/root-ca.pem:ro
    ports:
      - "127.0.0.1:8000:8000"   # solo accesible desde este equipo

volumes:
  sara_pgdata:
