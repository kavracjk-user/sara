# SARA — laboratorio. Fase 0: solo PostgreSQL.
# Fases siguientes agregan: wazuh (fase 1), prefect y sara-worker (fase 3),
# sara-api (fase 4) y sara-web (fase 5).
# Uso:  cp .env.example .env   # y edita las claves
#       docker compose up -d postgres
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
    ports:
      - "127.0.0.1:5432:5432"   # solo accesible desde esta máquina
    volumes:
      - sara_pgdata:/var/lib/postgresql/data
      # Se ejecuta solo la PRIMERA vez que se crea el volumen.
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sara_pgdata:
