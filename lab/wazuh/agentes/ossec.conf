<!--
  SARA — configuración de los agentes de prueba del laboratorio.
  Reducida a partir de wazuh-docker v4.14.10, wazuh-agent/config/wazuh-agent-conf
  (Wazuh Inc., GPLv2). Los valores CHANGE_* los reemplaza la imagen oficial al
  arrancar, con las variables WAZUH_MANAGER_SERVER y WAZUH_AGENT_NAME.

  Cambios respecto del original:
    - Respuesta activa DESACTIVADA (RNF-01: SARA y su laboratorio no contienen nada).
    - Sin rootcheck, SCA, inventario ni comandos periódicos: generan alertas ajenas
      al guion y gastan memoria.
    - Solo se vigilan las rutas del guion (docs/anexo-c-guion-casos.md) y los
      registros donde lab/eventos/ escribe eventos sintéticos.
    - Registro automático desactivado: el id viene de registrar_agentes.py.
-->
<ossec_config>
  <client>
    <server>
      <address>CHANGE_MANAGER_IP</address>
      <port>CHANGE_MANAGER_PORT</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>amzn, amzn2023</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <!-- Registro automático DESACTIVADO: el id lo fija lab/wazuh/registrar_agentes.py
         y la clave llega montada en etc/client.keys. (SUPOSICIÓN: con enabled=no el
         agente no intenta registrarse y usa client.keys; se confirma al levantar.) -->
    <enrollment>
      <enabled>no</enabled>
      <manager_address>CHANGE_ENROLL_IP</manager_address>
      <port>CHANGE_ENROLL_PORT</port>
      <agent_name>CHANGE_AGENT_NAME</agent_name>
      <groups>CHANGE_AGENT_GROUP</groups>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <sca>
    <enabled>no</enabled>
  </sca>

  <!-- Cambio de archivos: solo las rutas del guion (pares 5 a 8), en tiempo real.
       `restrict` limita cada carpeta a los archivos del guion. Los archivos base los
       crea agentes/base-lab.sh ANTES de arrancar Wazuh, así el primer escaneo los toma
       como línea base y no genera alertas.
       SUPOSICIÓN: sintaxis de `restrict` y tiempo real en contenedor; se confirma al levantar. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <directories realtime="yes" check_all="yes" restrict="^/etc/passwd$|^/etc/shadow$">/etc</directories>
    <directories realtime="yes" check_all="yes">/etc/nginx</directories>
    <directories realtime="yes" check_all="yes">/etc/postgresql</directories>
    <directories realtime="yes" check_all="yes" restrict=".com$">/tmp</directories>
    <directories realtime="yes" check_all="yes" restrict="^/var/log/auth.log$|^/var/log/syslog$">/var/log</directories>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <process_priority>10</process_priority>
    <max_eps>50</max_eps>
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <!-- Eventos sintéticos que escribe lab/eventos/ (nada de tráfico real):
       auth.log  líneas con formato de sshd            (pares 1 a 4, 10 relacionadas)
       red.log   líneas de descarte del cortafuegos    (par 10)
       eve.json  alertas con formato Suricata          (pares 9, 11, 12)
       SUPOSICIÓN: decodificador y regla de cada línea; se confirma con wazuh-logtest. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/lab/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/lab/red.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/lab/eve.json</location>
  </localfile>

  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
