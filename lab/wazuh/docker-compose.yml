# SARA — laboratorio, fase 1: Wazuh de un solo nodo + agentes de prueba.
#
# Adaptado de wazuh-docker v4.14.10, single-node/docker-compose.yml y
# wazuh-agent/docker-compose.yml (Wazuh Inc., licencia GPLv2):
#   https://github.com/wazuh/wazuh-docker/tree/v4.14.10
#
# Diferencias respecto del original (todas deliberadas):
#   1. Claves por variables de .env (el original las trae escritas en el archivo).
#   2. Puertos solo en 127.0.0.1. No se publican 1514/1515/514/55000: los agentes
#      viven en la misma red de Docker y SARA no usa la API del servidor.
#   3. Límites de memoria por contenedor (SUPOSICIÓN: medir con `docker stats`).
#   4. Memoria Java del indexador parametrizada (el original fija 1g).
#   5. `restart: unless-stopped` en vez de `always`, para que el laboratorio no
#      arranque solo al abrir Docker Desktop y consuma memoria sin querer.
#   6. Cinco agentes con la imagen oficial wazuh/wazuh-agent.
#
# Uso (desde la raíz del repositorio; ver lab/wazuh/README.md):
#   python lab/wazuh/preparar.py
#   docker compose --env-file .env -f lab/wazuh/generate-indexer-certs.yml run --rm generator
#   docker compose --env-file .env -f lab/wazuh/docker-compose.yml up -d
name: sara-lab-wazuh

x-agente: &agente
  image: wazuh/wazuh-agent:4.14.10
  restart: unless-stopped
  mem_limit: ${WAZUH_AGENTE_MEM:-256m}
  depends_on:
    - wazuh.manager
  volumes:
    # Configuración del agente del laboratorio (respuesta activa DESACTIVADA, RNF-01).
    - ./agentes/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
    # Carpetas donde los scripts de lab/ escriben los eventos sintéticos.
    - /var/log/lab
    - /lab/archivos

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.10
    hostname: wazuh.manager
    restart: unless-stopped
    mem_limit: ${WAZUH_MANAGER_MEM:-2g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    environment:
      - INDEXER_URL="https://wazuh.indexer:9200"
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_ADMIN_PASS:?define WAZUH_ADMIN_PASS en .env}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASS:?define WAZUH_API_PASS en .env}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.10
    hostname: wazuh.indexer
    restart: unless-stopped
    mem_limit: ${WAZUH_INDEXER_MEM:-3g}
    ports:
      - "127.0.0.1:9200:9200"   # solo accesible desde esta máquina
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms${WAZUH_INDEXER_HEAP:-1g} -Xmx${WAZUH_INDEXER_HEAP:-1g}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.10
    hostname: wazuh.dashboard
    restart: unless-stopped
    mem_limit: ${WAZUH_DASHBOARD_MEM:-1g}
    ports:
      - "127.0.0.1:443:5601"    # https://localhost  (solo esta máquina)
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_ADMIN_PASS:?define WAZUH_ADMIN_PASS en .env}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASS:?define WAZUH_DASHBOARD_PASS en .env}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASS:?define WAZUH_API_PASS en .env}
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

  # ---- Agentes de prueba (contenedores ligeros, no máquinas virtuales) ----
  # Los cuatro primeros están en el catálogo de activos (Anexo C); «pc-nuevo»
  # NO está en el catálogo a propósito.
  # PENDIENTE: Wazuh asigna el id por orden de registro. Fijar los id del Anexo C
  # (y el 099 de pc-nuevo) requiere un paso de registro explícito que aún no existe.
  srv-web:
    <<: *agente
    hostname: srv-web
    environment:
      - WAZUH_MANAGER_SERVER=wazuh.manager
      - WAZUH_AGENT_NAME=srv-web

  srv-bd:
    <<: *agente
    hostname: srv-bd
    environment:
      - WAZUH_MANAGER_SERVER=wazuh.manager
      - WAZUH_AGENT_NAME=srv-bd

  pc-analista:
    <<: *agente
    hostname: pc-analista
    environment:
      - WAZUH_MANAGER_SERVER=wazuh.manager
      - WAZUH_AGENT_NAME=pc-analista

  pc-lab-01:
    <<: *agente
    hostname: pc-lab-01
    environment:
      - WAZUH_MANAGER_SERVER=wazuh.manager
      - WAZUH_AGENT_NAME=pc-lab-01

  pc-nuevo:
    <<: *agente
    hostname: pc-nuevo
    environment:
      - WAZUH_MANAGER_SERVER=wazuh.manager
      - WAZUH_AGENT_NAME=pc-nuevo

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
