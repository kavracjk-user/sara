# Genera los certificados del laboratorio (quedan en lab/wazuh/config/, fuera de Git).
# Copia de wazuh-docker v4.14.10, single-node/generate-indexer-certs.yml
# (Wazuh Inc., licencia GPLv2), sin cambios funcionales.
services:
  generator:
    image: wazuh/wazuh-certs-generator:0.0.5
    hostname: wazuh-certs-generator
    environment:
      - CERT_TOOL_VERSION=4.14
      - CERT_TOOL_REPOSITORY=${CERT_TOOL_REPOSITORY:-prod}
    volumes:
      - ./config/wazuh_indexer_ssl_certs/:/certificates/
      - ./config/certs.yml:/config/certs.yml
